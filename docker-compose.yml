# Aplicação:        docker compose up --build
# Testes+cobertura: docker compose run --rm test
# As variáveis do Supabase são opcionais: sem elas o app funciona offline,
# salvando só no navegador (ver docs/adr/0002-supabase-backend.md).
services:
  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}

  test:
    build:
      context: .
      target: test
    profiles: ["test"]
